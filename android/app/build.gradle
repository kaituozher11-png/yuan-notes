apply plugin: 'com.android.application'

tasks.register('syncOfflineWeb', Sync) {
    from file('../../dist')
    into file('src/main/assets/web')
    doFirst {
        if (!file('../../dist/offline.html').exists()) throw new GradleException('请先在项目根目录执行 npm run build')
    }
}
preBuild.dependsOn syncOfflineWeb

android {
    namespace 'com.yingxing.notes.test'
    compileSdk 35

    defaultConfig {
        applicationId 'com.yingxing.notes.test'
        minSdk 26
        targetSdk 35
        versionCode 14
        versionName '0.4.3-offline'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
